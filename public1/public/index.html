<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュールカレンダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
  <!-- ✅ ログイン画面 -->
  <div id="login-section">
    <div class="login-card">
      <h2>ログイン</h2>
      <input type="email" id="loginEmail" placeholder="メールアドレス">
      <input type="password" id="loginPassword" placeholder="パスワード">
      <div class="login-btns">
        <button id="signupBtn" onclick="signup()">新規登録</button>
        <button id="loginBtn" onclick="login()">ログイン</button>
      </div>
      <p id="loginStatus"></p>
    </div>
  </div>

  <!-- ✅ ログイン後だけ表示されるメイン画面 -->
  <div id="mainApp" style="display:none;">
    <header>
      <div class="logo">
        <span class="logo-emoji">📅</span>
        <h1>スケジュールカレンダー</h1>
      </div>
      <div class="nav">
        <button id="prevMonth" class="nav-btn">←</button>
        <span id="monthDisplay">2025年10月</span>
        <button id="nextMonth" class="nav-btn">→</button>
      </div>
      <div class="search-box">
        <input id="search" type="text" placeholder="タスク名・タグで検索">
      </div>
    </header>

    <div class="container">
      <!-- 1. 左側サイドバー -->
      <aside class="sidebar-left">
        <!-- カテゴリーフィルター -->
        <div class="card category-card">
          <h2>カテゴリー</h2>
          <ul id="filters">
            <li data-category="資格">資格</li>
            <li data-category="スキル">スキル</li>
            <li data-category="副業">副業</li>
            <li data-category="投資">投資</li>
          </ul>
          <button id="addCategoryBtn" class="add-cat-btn">＋ 新しいカテゴリー</button>
        </div>

        <!-- 全体進捗率 -->
        <div class="card progress-card">
          <h2>全体進捗率</h2>
          <div class="progress-container">
            <div class="progress-bar">
              <div class="progress" id="progressBar" style="width:60%"></div>
            </div>
            <p id="progressLabel">全体進歩: 60%</p>
          </div>
        </div>

        <!-- 関連アプリリンク -->
        <div class="card links-card">
          <h2>関連アプリ</h2>
          <div class="app-links">
            <a href="https://thinktank-54321.web.app/" target="_blank" class="url-link">💡 知識ノートアプリ</a>
            <a href="https://sukonbu-kakeibo.web.app/" target="_blank" class="url-link">💰 家計簿アプリ</a>
            <a href="https://studyquest-54321.web.app/" target="_blank" class="url-link">🎒 勉強管理アプリ</a>
          </div>
        </div>

        <!-- ログアウト -->
        <div id="logout-section">
          <button id="logoutBtn" onclick="logout()">ログアウト</button>
        </div>
      </aside>

      <!-- 2. 中央メインコンテンツ（目標＆カレンダー） -->
      <main class="main-content">
        <!-- 目標ボード -->
        <section id="goalBoard" class="card">
          <div id="fixedGoals">
            <div class="year-nav">
              <button id="prevYear" class="year-nav-btn">◀</button>
              <h2 id="goalYearTitle">🎯 <span id="displayYear">2026</span>年度目標</h2>
              <button id="nextYear" class="year-nav-btn">▶</button>
            </div>
            <ul id="roadmapDisplay">
              <li id="currentYearGoalText"><span id="currentYearGoalContent">読み込み中...</span></li>
            </ul>
          </div>

          <div id="goalDisplay">
            <p>📅 <strong>今月の目標：</strong>
              <input type="checkbox" id="monthlyGoalCheck" />
              <span id="monthlyGoalText">未設定</span>
            </p>
            <p>🗓 <strong>今週の目標：</strong>
              <input type="checkbox" id="weeklyGoalCheck" />
              <span id="weeklyGoalText">未設定</span>
            </p>
          </div>

          <button id="toggleEditBtn" class="action-btn">⚙️ 目標を編集する</button>

          <div id="editableGoals" class="hidden-area">
            <h3>🗓 <span id="editYearLabel">2026</span>年度の目標を編集</h3>

            <label id="yearGoalLabel"><span id="editYearLabel2">2026</span>年度の目標</label>
            <textarea id="yearGoalInput" placeholder="この年度の目標を入力してください"></textarea>

            <hr>

            <label>今月の目標</label>
            <textarea id="monthlyGoalInput"></textarea>

            <label>今週の目標</label>
            <textarea id="weeklyGoalInput"></textarea>

            <button id="saveGoals" class="save-btn">💾 設定を保存</button>
          </div>
        </section>

        <!-- カレンダー本体 -->
        <main id="calendar" class="card calendar-card"></main>

        <!-- 日ごとのタスク一覧（非表示・カレンダークリック時に表示） -->
        <section id="taskListSection" class="card hidden">
          <h2 id="taskListTitle">選択した日のタスク</h2>
          <ul id="taskList"></ul>
        </section>
      </main>

      <!-- 3. 右側サイドバー（ストリーク、今日予定、ルーティン、週タスク） -->
      <aside class="sidebar-right">
        <!-- ストリーク & 今日の予定 -->
        <div class="card summary-card">
          <div id="streakDisplay" class="streak-box">🔥 0日連続</div>
          <section id="todaySummary" class="today-box"></section>
        </div>

        <!-- ルーティン設定 -->
        <section id="routineSection" class="card">
          <h2>ルーティン設定</h2>

          <!-- 時計 -->
          <div id="routineClock" class="clock"></div>

          <div class="routine-buttons">
            <button id="weekdayBtn" class="routine-type-btn">平日ルーティン</button>
            <button id="weekendBtn" class="routine-type-btn">休日ルーティン</button>
          </div>

          <div id="routineContainer">
            <div id="currentTimeLabel"></div>
            <ul id="routineList"></ul>
          </div>

          <div class="routine-actions">
            <button id="editRoutine" class="act-btn">✏️ 編集</button>
            <button id="saveRoutine" class="act-btn">💾 内容初期化</button>
            <button id="resetRoutine" class="act-btn">♻️ チェック外す</button>
          </div>
        </section>

        <!-- 今週のタスク -->
        <section id="weeklySection" class="card">
          <h2>🗓 今週のタスク</h2>
          <ul id="weeklyTaskList"></ul>
        </section>
      </aside>
    </div>

    <!-- 新規・編集タスクモーダル -->
    <div id="taskModal" class="modal hidden">
      <div class="modal-content">
        <h3>タスク設定</h3>
        <input id="taskTitle" placeholder="タイトル">
        <div class="modal-form-group">
          <label>カテゴリー</label>
          <select id="taskCategory">
            <option>資格</option>
            <option>スキル</option>
            <option>副業</option>
            <option>投資</option>
          </select>
        </div>
        <div class="modal-form-group">
          <label>優先度</label>
          <select id="taskPriority">
            <option>高</option>
            <option>中</option>
            <option>低</option>
          </select>
        </div>
        <div class="modal-form-group">
          <label>進捗状況</label>
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; width: 100%;">
            <input type="range" id="taskProgress" min="0" max="100" value="0" style="margin-bottom:0; flex-grow: 1;" oninput="this.nextElementSibling.value = this.value + '%'">
            <output style="font-size:14px; min-width:35px; text-align:right;">0%</output>
          </div>
        </div>
        <div class="modal-form-group">
          <label>メモ</label>
          <textarea id="taskMemo" placeholder="メモ"></textarea>
        </div>
        <div class="modal-actions">
          <button id="saveTask" class="modal-save-btn">保存</button>
          <button id="closeModal" class="modal-close-btn">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
  </body>
</html>
